<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='images/CITLogo.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='modern.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    <!--Placeholder for extra styling and js for home page and signup pages-->
    
    {% block extra_styling_js %} {% endblock %}
</head>
<body>
    <!--Header-->
    <header id="headerSection">
        <a id="homePage" href="{{ url_for('homePage') }}" data-url="{{ url_for('homePage') }}">
            <img src="{{ url_for('static', filename='images/CITLogo.png') }}" alt="" id="CITLogo">
            <p id="CITSignups">CIT Signups</p>
        </a>
    
        <!-- Navigation Links -->
        <nav id="navLinks" aria-label="Main navigation">
            <a href="{{ url_for('about') }}" class="headerItem headerLink">About</a>
            <a href="{{ url_for('calendar') }}" class="headerItem headerLink">Calendar</a>
            <a href="{{ url_for('homePage') }}" class="headerItem headerLink">Events</a>
            <!-- Admin Management Link - Only visible to admins -->
            {% if admin is defined and admin %}
            <a href="{{ url_for('manage_admins') }}" class="headerItem headerLink">Manage Admins</a>
            <a href="{{ url_for('archived_events') }}" class="headerItem headerLink">Archived Events</a>
            {% endif %}
        </nav>
        
        <details id="accountMenu">
            <summary id="optionBarTrigger">
                <span class="headerItem" id="signinText">{{email.split('@')[0] if email else 'User'}}</span>
            </summary>
            <div id="dropdown">
                <a href="{{url_for('account_details')}}"><span id="accountDetails">Account Details</span></a>
                <a href="{{url_for('logout')}}"><span id="logOut">Log Out</span></a>
            </div>
        </details>
    </header>
    

    <main id="bodySection">
        <!--Placeholder for page heading and expectations for home page and event details for signup pages-->
        {% block heading %} {% endblock %}

        {% block content %} {% endblock %}
    </main>
</body>
</html>
