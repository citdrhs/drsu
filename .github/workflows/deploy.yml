name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: drhscit.org
          port: 4243
          username: migration_user
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/drsu/www
            git fetch origin main
            git reset --hard origin/main
            sudo systemctl restart drsu
