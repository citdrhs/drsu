<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: 'Baloo Bhaijaan 2', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        h1 { margin-bottom: 20px; }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            background: white;
            width: 300px;
        }

        div {
            display: flex;
            flex-direction: column;
        }

        .logo {
            width: 100px;
            height: auto;
            max-width: 80%;
            max-height: 100px;
            display: block;
            margin: 0 auto 20px;
            object-fit: contain;
        }

        .account-actions {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .account-action-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            padding: 10px 12px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .create-account-btn {
            background-color: #0d6efd;
            color: white;
        }

        .forgot-password-btn {
            background-color: #f8f9fa;
            color: #212529;
            border: 1px solid #ced4da;
        }

        .account-action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRK_m6KiI839yvOdiN_B0Yw_fU3rkWuvFiFA&s" alt="Logo" class="logo">
    <h1>Login</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/drsu/">
        {{ form.hidden_tag() }}
        <div>
            <label for="email">Email</label>
            <input id="email" name="email" required type="email" value="{{ form.email.data or '' }}">
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" name="password" required type="password" value="">
        </div>
        <div>
            <input type="submit" id="submit" name="submit" value="Login">
        </div>
    </form><br>

    <div class="account-actions">
        <a class="account-action-btn create-account-btn" href="/drsu/create_account/">Create Account</a>
        <a class="account-action-btn forgot-password-btn" href="/drsu/forgot_password/">Forgot Password?</a>
    </div>
</body>
</html>
